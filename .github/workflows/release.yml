name: Release

# Push a tag vX.Y.Z whose version matches Cargo.toml: tests, then `cargo publish` to crates.io and a GitHub release.
# Authentication: crates.io Trusted Publishing (OIDC, no stored secret) once it is configured for this crate on
# crates.io; until then (the very first publish has to use a token) the CARGO_REGISTRY_TOKEN secret.
on:
  push:
    tags: ['v*']

permissions:
  contents: write   # the GitHub release
  id-token: write   # Trusted Publishing

concurrency:
  group: release
  cancel-in-progress: false

jobs:
  publish:
    name: Publish to crates.io
    runs-on: ubuntu-latest
    environment: crates-io
    steps:
      - uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
      - name: The tag matches Cargo.toml
        run: |
          version=$(sed -n 's/^version *= *"\(.*\)"/\1/p' Cargo.toml | head -1)
          [[ "$GITHUB_REF_NAME" == "v$version" ]] || { echo "::error::tag $GITHUB_REF_NAME does not match Cargo.toml version $version"; exit 1; }
          echo "VERSION=$version" >> "$GITHUB_ENV"
      - uses: dtolnay/rust-toolchain@e2a55d2ffb04f378e9626c28d38b36d230d1e12f # master
        with:
          toolchain: stable
          targets: thumbv6m-none-eabi, thumbv8m.main-none-eabihf
      - run: cargo test --all-targets && cargo test --doc
      - run: cargo build --target thumbv6m-none-eabi && cargo build --target thumbv8m.main-none-eabihf
      - name: Token source
        id: source
        env:
          TOKEN: ${{ secrets.CARGO_REGISTRY_TOKEN }}
        run: if [[ -n $TOKEN ]]; then echo "secret=true" >> "$GITHUB_OUTPUT"; else echo "secret=false" >> "$GITHUB_OUTPUT"; fi
      - name: Trusted Publishing token
        id: auth
        if: steps.source.outputs.secret == 'false'
        uses: rust-lang/crates-io-auth-action@c6f97d42243bad5fab37ca0427f495c86d5b1a18 # v1.0.5
      - name: Publish
        env:
          CARGO_REGISTRY_TOKEN: ${{ steps.auth.outputs.token || secrets.CARGO_REGISTRY_TOKEN }}
        run: cargo publish
      - name: GitHub release
        env:
          GH_TOKEN: ${{ github.token }}
        run: gh release create "$GITHUB_REF_NAME" --title "ferric-link $VERSION" --generate-notes --verify-tag
